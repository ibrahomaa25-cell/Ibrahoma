<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>موقعي الشخصي</title>
  <style>
    body {
      background: #f5f5f5;
      font-family: Arial;
      text-align: center;
      padding: 20px;
      color: #333;
    }
    .box {
      background: white;
      width: 90%;
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    img {
      width: 150px;
      border-radius: 50%; /* تخلي الصورة دائرية */
      border: 4px solid #00796b;
    }
    h1 {
      color: #00796b;
    }
    .btn {
      display: inline-block;
      background: #00796b;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 8px;
      margin: 5px;
    }
    .btn:hover {
      background: #004d40;
    }
  </style>
</head>
<body>
  
  <div class="box">
    <img src="https://picsum.photos/200" alt="صورتي">
    <h1>مرحبا أنا [اكتب اسمك هنا]</h1>
    <p>أنا بتعلم برمجة مواقع من الجوال. 
       هدفي أصمم مواقع احترافية.
    </p>
    
    <a href="https://youtube.com" class="btn">يوتيوب</a>
    <a href="https://facebook.com" class="btn">فيسبوك</a>
    
  </div>

</body>
</html>
